# Application Configuration
spring.application.name=Volunteer Registration Campaign
server.port=8090

# H2 Database Configuration (file-based for data persistence)
spring.datasource.url=jdbc:h2:file:./data/volunteerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Email Configuration (SMTP)
# Set these environment variables or update values for your SMTP server
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Email Settings
app.email.from=${EMAIL_FROM:noreply@volunteer.org}
app.email.organization-name=${ORG_NAME:VolunteerHub}
app.email.enabled=${EMAIL_ENABLED:false}
app.email.reminder.cron=0 0 9 * * ?

# Enable scheduling
spring.task.scheduling.pool.size=2

# HTTPS and Security Configuration
# Uncomment and configure for HTTPS in production
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH:}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# Secure cookie settings
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Security headers - additional configuration
# Enforce HTTPS redirect (set to true in production)
server.http2.enabled=true

# Disable server signature
server.error.whitelabel.enabled=false

# Input validation - max upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
