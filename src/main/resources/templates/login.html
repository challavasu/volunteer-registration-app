<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Admin Login - VolunteerHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/login.css" rel="stylesheet">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <i class="fas fa-hands-helping"></i>
                <span>VolunteerHub</span>
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/my-registrations">My Registrations</a></li>
            </ul>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h1>
                    <i class="fas fa-hands-helping"></i>
                    VolunteerHub Admin
                </h1>
                <p>Sign in to your admin account</p>
            </div>

            <div class="login-body">
                <form id="loginForm">
                    <input type="hidden" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div id="errorMessage" class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorText">Invalid credentials</span>
                    </div>

                    <div th:if="${error}" class="error-message show">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:text="${error}">Invalid credentials</span>
                    </div>

                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user icon-margin"></i>
                            Username
                        </label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock icon-margin"></i>
                            Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>

</html>
