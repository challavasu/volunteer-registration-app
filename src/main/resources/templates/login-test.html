<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-box {
            border: 2px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .test-box h2 {
            margin-top: 0;
        }
        input {
            padding: 8px;
            width: 200px;
            margin: 5px 0;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #response {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .error {
            color: #d32f2f;
        }
        .success {
            color: #388e3c;
        }
    </style>
</head>
<body>
    <h1>🔐 Login Test (Debug Mode)</h1>

    <div class="test-box">
        <h2>Test 1: Check if Admin User Exists</h2>
        <button onclick="checkAdminUser()">Check Database</button>
        <div id="response1"></div>
    </div>

    <div class="test-box">
        <h2>Test 2: Try Login via API</h2>
        <label>Username:</label><br>
        <input type="text" id="username" value="admin" placeholder="Username"><br>

        <label>Password:</label><br>
        <input type="password" id="password" value="admin123" placeholder="Password"><br>

        <button onclick="testLogin()">Test Login (API)</button>
        <div id="response2"></div>
    </div>

    <div class="test-box">
        <h2>Test 3: Try Form Submission</h2>
        <form id="testForm" action="/login" method="POST">
            <input type="text" name="username" value="admin" placeholder="Username">
            <input type="password" name="password" value="admin123" placeholder="Password">
            <button type="submit">Test Form Submit</button>
        </form>
        <div id="response3"></div>
    </div>

    <script>
        function checkAdminUser() {
            console.log('Checking admin user...');
            const responseDiv = document.getElementById('response1');

            fetch('/api/debug/check-admin')
                .then(res => res.text())
                .then(data => {
                    console.log('Response:', data);
                    responseDiv.textContent = data;
                    if (data.includes('EXISTS')) {
                        responseDiv.className = 'success';
                    } else {
                        responseDiv.className = 'error';
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    responseDiv.textContent = 'ERROR: ' + err.message;
                    responseDiv.className = 'error';
                });
        }

        function testLogin() {
            console.log('Testing login...');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const responseDiv = document.getElementById('response2');

            responseDiv.textContent = 'Sending login request...';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                console.log('Response status:', res.status);
                console.log('Response URL:', res.url);
                return res.text().then(text => ({status: res.status, text: text}));
            })
            .then(({status, text}) => {
                console.log('Response text length:', text.length);

                if (status === 200) {
                    if (text.includes('admin')) {
                        responseDiv.textContent = '✅ LOGIN SUCCESSFUL!\nRedirected to admin dashboard';
                        responseDiv.className = 'success';
                    } else {
                        responseDiv.textContent = '❌ LOGIN FAILED\nReturned to login page\n\nResponse contains:\n' + text.substring(0, 500);
                        responseDiv.className = 'error';
                    }
                } else {
                    responseDiv.textContent = '❌ LOGIN FAILED (Status: ' + status + ')\n\n' + text.substring(0, 500);
                    responseDiv.className = 'error';
                }
            })
            .catch(err => {
                console.error('Error:', err);
                responseDiv.textContent = 'ERROR: ' + err.message;
                responseDiv.className = 'error';
            });
        }

        document.getElementById('testForm').addEventListener('submit', function(e) {
            console.log('Form submitted');
            const responseDiv = document.getElementById('response3');
            responseDiv.textContent = 'Form submitted... waiting for redirect or response...';
        });

        console.log('Login test page loaded');
    </script>
</body>
</html>
